# Target companies. The scraper finds each company's job board automatically.
#
# Optional fields per company:
#   slugs:   board names to try first (e.g. "gongio" for Gong)
#   board:   pin the platform once known, e.g.  board: {ats: greenhouse, slug: stripe}
#   workday: a Workday careers URL, e.g. https://acme.wd5.myworkdayjobs.com/External
#   skip:    true to pause a company
#
# Supported platforms: greenhouse, lever, ashby, smartrecruiters, workable, recruitee, workday.

